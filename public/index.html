<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LogiTech Express</title><link rel="stylesheet" href="/styles.css"></head><body><header><strong>LogiTech Express</strong><nav><a href="#motoristas">Motoristas</a><a href="#veiculos">Veículos</a><a href="#entregas">Entregas</a></nav></header><main><section class="hero"><h1>Gestão logística integrada</h1><p>Cadastre motoristas, veículos e entregas com persistência real via API e banco MySQL.</p><div id="toast"></div></section><section class="grid"><article id="motoristas"><h2>Motoristas</h2><form data-form="motoristas"><input name="nome" placeholder="Nome" required><input name="cpf" placeholder="CPF" required><input name="telefone" placeholder="Telefone" required><button>Cadastrar</button></form><div class="state" data-state="motoristas">Carregando...</div><ul data-list="motoristas"></ul></article><article id="veiculos"><h2>Veículos</h2><form data-form="veiculos"><input name="placa" placeholder="Placa" required><input name="modelo" placeholder="Modelo" required><input name="capacidadeCarga" type="number" min="1" placeholder="Capacidade de carga" required><button>Cadastrar</button></form><div class="state" data-state="veiculos">Carregando...</div><ul data-list="veiculos"></ul></article><article id="entregas"><h2>Entregas</h2><form data-form="entregas"><input name="descricao" placeholder="Descrição"><input name="origem" placeholder="Origem" required><input name="destino" placeholder="Destino" required><select name="motoristaId" required></select><select name="veiculoId" required></select><button>Cadastrar</button></form><div class="state" data-state="entregas">Carregando...</div><ul data-list="entregas"></ul></article></section></main><script src="/app.js"></script></body></html>
